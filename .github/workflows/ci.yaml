name: CI

on:
  push:
    branches:
    - main

  workflow_dispatch:

permissions:
  contents: read

env:
  ALPINE_VERSION: "3.24.0"
  BUN_VERSION: "1.3.14"
  GH_VERSION: "2.95.0"
  JQ_VERSION: "1.8.2"
  TINI_VERSION: "0.19.0"
  UBUNTU_VERSION: "26.04"
  UV_VERSION: "0.11.23"

jobs:
  release:
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
    - run: |
        echo IMAGE_CREATED=$(date --utc +'%Y-%m-%dT%H:%M:%SZ') >> $GITHUB_ENV
    - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        labels: |
          org.opencontainers.image.authors=Yang Sheng Han <progamesigner@gmail.com>
          org.opencontainers.image.created=${{ env.IMAGE_CREATED }}
          org.opencontainers.image.description=devtools
          org.opencontainers.image.documentation=https://github.com/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.title=devtools
          org.opencontainers.image.url=https://github.com/${{ github.repository }}
          org.opencontainers.image.vendor=https://github.com/${{ github.repository }}
          org.opencontainers.image.version=${{ github.sha }}
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ghcr.io/${{ github.repository }}:latest
        build-args: |
          ALPINE_VERSION=${{ env.ALPINE_VERSION }}

    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: "{{defaultContext}}:claude-code"
        labels: |
          org.opencontainers.image.authors=Yang Sheng Han <progamesigner@gmail.com>
          org.opencontainers.image.created=${{ env.IMAGE_CREATED }}
          org.opencontainers.image.description=claude-code
          org.opencontainers.image.documentation=https://github.com/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.title=claude-code
          org.opencontainers.image.url=https://github.com/${{ github.repository }}
          org.opencontainers.image.vendor=https://github.com/${{ github.repository }}
          org.opencontainers.image.version=${{ github.sha }}
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ghcr.io/${{ github.repository }}/claude-code:latest
        build-args: |
          ALPINE_VERSION=${{ env.ALPINE_VERSION }}
          BUN_VERSION=${{ env.BUN_VERSION }}
          GH_VERSION=${{ env.GH_VERSION }}
          JQ_VERSION=${{ env.JQ_VERSION }}
          TINI_VERSION=${{ env.TINI_VERSION }}
          UBUNTU_VERSION=${{ env.UBUNTU_VERSION }}
          UV_VERSION=${{ env.UV_VERSION }}

    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: "{{defaultContext}}:codex"
        labels: |
          org.opencontainers.image.authors=Yang Sheng Han <progamesigner@gmail.com>
          org.opencontainers.image.created=${{ env.IMAGE_CREATED }}
          org.opencontainers.image.description=codex
          org.opencontainers.image.documentation=https://github.com/${{ github.repository }}
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.title=codex
          org.opencontainers.image.url=https://github.com/${{ github.repository }}
          org.opencontainers.image.vendor=https://github.com/${{ github.repository }}
          org.opencontainers.image.version=${{ github.sha }}
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ghcr.io/${{ github.repository }}/codex:latest
        build-args: |
          ALPINE_VERSION=${{ env.ALPINE_VERSION }}
          BUN_VERSION=${{ env.BUN_VERSION }}
          GH_VERSION=${{ env.GH_VERSION }}
          JQ_VERSION=${{ env.JQ_VERSION }}
          TINI_VERSION=${{ env.TINI_VERSION }}
          UBUNTU_VERSION=${{ env.UBUNTU_VERSION }}
          UV_VERSION=${{ env.UV_VERSION }}
